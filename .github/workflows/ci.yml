name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  posix-regression:
    # POSIX regression: the full original suite must stay green on
    # macOS/Linux (the Windows port must not change POSIX behavior).
    name: POSIX regression (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B -m pytest -q
          python -m compileall -q src tests

  windows-suite:
    # Windows suite: the full test set plus the native ConPTY / named-pipe /
    # Desktop-IPC tests (pywinpty is installed via the `windows` extra).
    name: Windows suite (py${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows]"
      - name: Test
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q
          python -m compileall -q src tests
